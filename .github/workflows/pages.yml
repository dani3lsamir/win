# Publishes the installers on GitHub Pages so you can run:
#   Windows:  irm dani3lsamir.github.io/win | iex
#   Linux:    curl -fsSL dani3lsamir.github.io/win/linux | bash
name: Publish short command

on:
  push:
    branches: [main]
    paths: [install.ps1, linux.sh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _site/linux
          cp install.ps1 _site/index.html
          cp linux.sh _site/linux/index.html
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
