# Publica install.ps1 en https://dani3lsamir.github.io/win para poder usar:
#   irm dani3lsamir.github.io/win | iex
name: Publicar comando corto

on:
  push:
    branches: [main]
    paths: [install.ps1]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp install.ps1 _site/index.html
      - uses: actions/upload-pages-artifact@v3
      - id: deploy
        uses: actions/deploy-pages@v4
